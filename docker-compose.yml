version: '3.8'

services:
  # Main InfiDao application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FLOW_FONT_CDN_BASE: ${NEXT_PUBLIC_FLOW_FONT_CDN_BASE:-}
        INFIDAO_RELEASE_COMMIT: ${INFIDAO_RELEASE_COMMIT:-}
    container_name: infidao-app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/runtime/lancedb
      - LANCEDB_PATH=/app/runtime/lancedb
      - BGE_MODEL_PATH=/app/models/bge-m3
      - REDIS_URL=redis://redis:6379
      - FLOW_REDIS_URL=redis://redis:6379
      - FLOW_REDIS_NAMESPACE=${FLOW_REDIS_NAMESPACE:?Set isolated flow namespace}
      - FLOW_SESSION_SECRET=${FLOW_SESSION_SECRET:?Set a 32+ character session secret}
      - FLOW_PUBLIC_ORIGIN=${FLOW_PUBLIC_ORIGIN:?Set the HTTPS browser origin}
      - FLOW_TRUST_PROXY=1
      - FLOW_NATIVE_HTTP_ENABLED=${FLOW_NATIVE_HTTP_ENABLED:-0}
      - FLOW_API_KEY=${FLOW_API_KEY:?Set the server-only model key}
      - FLOW_BASE_URL=${FLOW_BASE_URL:-https://api.deepseek.com}
      - FLOW_MODEL=${FLOW_MODEL:-deepseek-flash}
      - FLOW_MAX_ACTIVE_SITE=${FLOW_MAX_ACTIVE_SITE:?Set site concurrency limit}
      - FLOW_MAX_ACTIVE_OWNER=${FLOW_MAX_ACTIVE_OWNER:?Set reader concurrency limit}
      - FLOW_MAX_ACTIVE_IP=${FLOW_MAX_ACTIVE_IP:?Set IP concurrency limit}
      - FLOW_REQUESTS_MINUTE_SITE=${FLOW_REQUESTS_MINUTE_SITE:?Set site request limit}
      - FLOW_REQUESTS_MINUTE_OWNER=${FLOW_REQUESTS_MINUTE_OWNER:?Set reader request limit}
      - FLOW_REQUESTS_MINUTE_IP=${FLOW_REQUESTS_MINUTE_IP:?Set IP request limit}
      - FLOW_MODEL_CALLS_DAY_SITE=${FLOW_MODEL_CALLS_DAY_SITE:?Set site model budget}
      - FLOW_MODEL_CALLS_DAY_OWNER=${FLOW_MODEL_CALLS_DAY_OWNER:?Set reader model budget}
      - FLOW_MODEL_CALLS_DAY_IP=${FLOW_MODEL_CALLS_DAY_IP:?Set IP model budget}
      - LOG_LEVEL=info
      - ENABLE_METRICS=true
      - KV_CACHE=true
    volumes:
      - infidao_data:/app/runtime
      - infidao_models:/app/models
      - infidao_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - infidao-network

  # Redis cache service
  redis:
    image: redis:7.4.11-alpine
    container_name: infidao-redis
    volumes:
      - infidao_redis:/data
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - infidao-network

  # Optional: PostgreSQL for metadata storage
  postgres:
    image: postgres:15-alpine
    container_name: infidao-postgres
    environment:
      - POSTGRES_DB=infidao
      - POSTGRES_USER=infidao
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    volumes:
      - infidao_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - infidao-network
    profiles:
      - with-postgres

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: infidao-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - infidao-network
    profiles:
      - with-nginx

  # Development environment
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: infidao-dev
    ports:
      - "3000:3000"
      - "9229:9229" # Debug port
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_PATH=/app/data/lancedb
      - BGE_MODEL_PATH=/app/models/bge-m3
      - REDIS_URL=redis://redis-dev:6379
      - DEBUG=infidao:*
      - HOT_RELOAD=true
    volumes:
      - ./:/app:ro
      - infidao_dev_data:/app/data
      - infidao_dev_models:/app/models
      - /app/node_modules
      - /app/.next
    depends_on:
      - redis-dev
    restart: unless-stopped
    networks:
      - infidao-dev-network
    profiles:
      - development

  # Development Redis
  redis-dev:
    image: redis:7-alpine
    container_name: infidao-redis-dev
    ports:
      - "6380:6379"
    volumes:
      - infidao_dev_redis:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - infidao-dev-network
    profiles:
      - development

# Volume definitions
volumes:
  infidao_data:
    driver: local
  infidao_models:
    driver: local
  infidao_logs:
    driver: local
  infidao_redis:
    driver: local
  infidao_postgres:
    driver: local
  infidao_dev_data:
    driver: local
  infidao_dev_models:
    driver: local
  infidao_dev_redis:
    driver: local

# Network definitions
networks:
  infidao-network:
    driver: bridge
  infidao-dev-network:
    driver: bridge
